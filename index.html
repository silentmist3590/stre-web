<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Kiểm tra trình duyệt TV</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
html, body { margin: 0; padding: 0; background: #101418; color: #f2f2f2; font-family: Arial, Helvetica, sans-serif; }
body { font-size: 22px; line-height: 1.35; padding: 200px 40px 60px 40px; }
#bar { position: fixed; top: 0; left: 0; right: 0; height: 170px; background: #1c242c; border-bottom: 4px solid #3b82f6; padding: 10px 40px; overflow: hidden; z-index: 5; }
#bar .big { font-size: 34px; font-weight: bold; }
#bar .small { font-size: 18px; color: #b8c4d0; margin-top: 4px; }
#keylog { font-size: 18px; color: #dbe6f2; margin-top: 4px; white-space: nowrap; overflow: hidden; }
h1 { font-size: 30px; margin: 0 0 6px 0; }
h2 { font-size: 26px; margin: 28px 0 8px 0; border-bottom: 2px solid #3a4652; padding-bottom: 4px; }
p.hint { color: #b8c4d0; margin: 0 0 10px 0; }
.row { padding: 5px 0; border-bottom: 1px solid #26303a; overflow: hidden; }
.k { float: left; width: 62%; }
.v { float: left; width: 38%; font-weight: bold; word-wrap: break-word; }
.ok { color: #6ee7a0; }
.bad { color: #ff8a8a; }
.ua { font-size: 18px; word-wrap: break-word; color: #dbe6f2; }
</style>
</head>
<body>

<div id="bar">
  <div class="big" id="lastkey">Bấm một nút trên remote…</div>
  <div class="small" id="pointer">Con trỏ/chuột: chưa có sự kiện</div>
  <div id="keylog"></div>
</div>

<h1>Kiểm tra trình duyệt TV</h1>
<p class="hint">Bấm lần lượt: lên, xuống, trái, phải, OK, Back, Menu và các nút khác. Phím vừa bấm hiện ở thanh trên cùng. Sau đó cuộn xuống và chụp ảnh màn hình các phần bên dưới.</p>

<div id="out"></div>

<script>
(function () {
  var out = document.getElementById('out');
  var html = '';

  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
  }
  function section(t) {
    html += '<h2>' + esc(t) + '</h2>';
  }
  function row(label, val, ok, id) {
    var cls = ok === true ? 'ok' : (ok === false ? 'bad' : '');
    html += '<div class="row"><span class="k">' + esc(label) + '</span><span class="v ' + cls + '"' +
      (id ? ' id="' + id + '"' : '') + '>' + esc(val) + '</span></div>';
  }
  function yes(label, cond) {
    row(label, cond ? 'CÓ' : 'KHÔNG', !!cond);
  }
  function syntax(label, code) {
    var ok = true;
    try { new Function(code); } catch (e) { ok = false; }
    yes(label, ok);
  }

  var ua = navigator.userAgent || '';

  /* 1. Thông tin trình duyệt */
  section('Thông tin trình duyệt');
  html += '<div class="row ua">' + esc(ua) + '</div>';
  var m = /Chrom(?:e|ium)\/(\d+)/.exec(ua);
  row('Phiên bản Chrome/Chromium', m ? m[1] : 'không thấy trong userAgent', m ? true : null);
  m = /AppleWebKit\/([\d.]+)/.exec(ua);
  row('AppleWebKit', m ? m[1] : 'không thấy', null);
  row('Màn hình (screen)', screen.width + ' x ' + screen.height, null);
  row('Vùng hiển thị (window)', window.innerWidth + ' x ' + window.innerHeight, null);
  row('devicePixelRatio', String(window.devicePixelRatio || 1), null);
  row('Ngôn ngữ', navigator.language || '-', null);
  row('Giao thức trang', location.protocol, null);

  /* 2. Cú pháp JavaScript */
  section('Cú pháp JavaScript');
  syntax('Kiểm tra cơ sở (phải là CÓ)', 'var x = 1;');
  syntax('let / const', 'let a = 1; const b = 2;');
  syntax('Hàm mũi tên =>', 'var f = function () { return (function (a) { return a; }); }; var g = (a) => a;');
  syntax('Template literal', 'var s = `x${1}`;');
  syntax('class', 'class A {}');
  syntax('Destructuring', 'var o = {a: 1}; var {a} = o;');
  syntax('Spread [...a]', 'var a = [1]; var b = [...a];');
  syntax('async / await', 'async function f() { await 1; }');
  syntax('Optional chaining ?.', 'var o = {}; var x = o?.a;');
  syntax('Nullish ??', 'var x = null ?? 1;');
  syntax('BigInt (1n)', 'var x = 1n;');

  /* 3. API trình duyệt */
  section('API trình duyệt');
  yes('Promise', typeof window.Promise !== 'undefined');
  yes('fetch', typeof window.fetch === 'function');
  yes('XMLHttpRequest', typeof window.XMLHttpRequest !== 'undefined');
  yes('Web Worker', typeof window.Worker !== 'undefined');
  yes('WebAssembly', typeof window.WebAssembly === 'object');
  yes('localStorage', (function () {
    try { localStorage.setItem('t', '1'); localStorage.removeItem('t'); return true; } catch (e) { return false; }
  })());
  yes('IndexedDB', !!window.indexedDB);
  yes('Service Worker', !!(navigator.serviceWorker));
  yes('IntersectionObserver', typeof window.IntersectionObserver !== 'undefined');
  yes('ResizeObserver', typeof window.ResizeObserver !== 'undefined');
  yes('requestAnimationFrame', typeof window.requestAnimationFrame === 'function');
  yes('Fullscreen API', !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen));
  yes('Array.prototype.includes', typeof [].includes === 'function');
  yes('Object.assign', typeof Object.assign === 'function');
  yes('URL / URLSearchParams', typeof window.URL === 'function' && typeof window.URLSearchParams === 'function');

  /* 4. CSS */
  section('CSS');
  var st = document.createElement('div').style;
  yes('Flexbox', 'flex' in st || 'webkitFlex' in st);
  yes('Grid', 'gridTemplateColumns' in st);
  yes('gap', 'gap' in st);
  yes('aspect-ratio', 'aspectRatio' in st);
  yes('Biến CSS (var)', !!(window.CSS && CSS.supports && CSS.supports('--a', '0')));
  yes('position: sticky', (function () {
    if (window.CSS && CSS.supports) { return CSS.supports('position', 'sticky') || CSS.supports('position', '-webkit-sticky'); }
    return false;
  })());
  yes('transform', 'transform' in st || 'webkitTransform' in st);
  yes('object-fit', 'objectFit' in st);

  /* 5. Video */
  section('Video');
  var v = document.createElement('video');
  var types = [
    ['MP4 H.264 + AAC', 'video/mp4; codecs="avc1.42E01E, mp4a.40.2"'],
    ['MP4 H.265 / HEVC', 'video/mp4; codecs="hev1.1.6.L93.B0"'],
    ['WebM VP8', 'video/webm; codecs="vp8, vorbis"'],
    ['WebM VP9', 'video/webm; codecs="vp9"'],
    ['HLS (m3u8) gốc', 'application/vnd.apple.mpegurl'],
    ['HLS (x-mpegURL)', 'application/x-mpegURL']
  ];
  var i, r;
  if (v && v.canPlayType) {
    for (i = 0; i < types.length; i++) {
      r = v.canPlayType(types[i][1]);
      row(types[i][0], r ? r : 'KHÔNG', !!r);
    }
  } else {
    row('Thẻ <video>', 'KHÔNG', false);
  }
  var MS = window.MediaSource || window.WebKitMediaSource;
  yes('MediaSource (MSE)', !!MS);
  if (MS && MS.isTypeSupported) {
    yes('MSE hỗ trợ H.264 + AAC', MS.isTypeSupported('video/mp4; codecs="avc1.42E01E, mp4a.40.2"'));
  }

  /* 6. Mạng */
  section('Mạng');
  row('Gọi addon Cinemeta (HTTPS, CORS)', 'đang thử…', null, 'nettest');

  out.innerHTML = html;

  /* Kiểm tra mạng bằng XHR (chạy được cả trên trình duyệt cũ) */
  (function () {
    var el = document.getElementById('nettest');
    function show(text, ok) {
      el.innerHTML = esc(text);
      el.className = 'v ' + (ok ? 'ok' : 'bad');
    }
    try {
      var x = new XMLHttpRequest();
      x.open('GET', 'https://v3-cinemeta.strem.io/manifest.json', true);
      x.timeout = 15000;
      x.onload = function () {
        var parsed = false;
        try { parsed = !!JSON.parse(x.responseText).id; } catch (e) { parsed = false; }
        show('HTTP ' + x.status + (parsed ? ', đọc JSON OK' : ', JSON lỗi'), x.status === 200 && parsed);
      };
      x.onerror = function () { show('LỖI (mạng, HTTPS hoặc CORS)', false); };
      x.ontimeout = function () { show('HẾT GIỜ (15 giây)', false); };
      x.send();
    } catch (e) {
      show('LỖI: ' + e.message, false);
    }
  })();

  /* Ghi nhận phím */
  var lastkey = document.getElementById('lastkey');
  var keylog = document.getElementById('keylog');
  var history_ = [];
  function logKey(text) {
    history_.push(text);
    if (history_.length > 6) { history_.shift(); }
    keylog.innerHTML = esc(history_.join('  |  '));
  }
  document.addEventListener('keydown', function (e) {
    var code = e.keyCode || e.which || 0;
    var key = (e.key !== undefined && e.key !== '') ? e.key : '-';
    var cd = e.code ? e.code : '-';
    lastkey.innerHTML = esc('Phím: ' + key + '   keyCode: ' + code + '   code: ' + cd);
    logKey(key + '/' + code);
  }, false);

  /* Phát hiện nút Back qua popstate */
  try {
    history.pushState({ tvcheck: 1 }, '', location.href);
    window.addEventListener('popstate', function () {
      lastkey.innerHTML = esc('Nút BACK đã kích hoạt popstate (trang đã chặn được)');
      logKey('BACK(popstate)');
      history.pushState({ tvcheck: 1 }, '', location.href);
    }, false);
  } catch (e) { /* bỏ qua */ }

  /* Con trỏ / chuột */
  var pointer = document.getElementById('pointer');
  var moves = 0, clicks = 0, wheels = 0;
  function updPointer() {
    pointer.innerHTML = esc('Con trỏ/chuột: di chuyển ' + moves + ', nhấp ' + clicks + ', cuộn ' + wheels);
  }
  document.addEventListener('mousemove', function () { moves++; updPointer(); }, false);
  document.addEventListener('click', function () { clicks++; updPointer(); }, false);
  document.addEventListener('wheel', function () { wheels++; updPointer(); }, false);
})();
</script>
</body>
</html>
